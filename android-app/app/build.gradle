plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.qpetiscos.agenda'
    compileSdk 35

    defaultConfig {
        applicationId 'pt.qpetiscos.agenda'
        minSdk 26
        targetSdk 35
        versionCode 601
        versionName '0.6.1'
    }

    buildTypes {
        release {
            minifyEnabled false
