plugins { id 'com.android.application' }
android {
 namespace 'pt.qpetiscos.agenda'
 compileSdk 35
 defaultConfig { applicationId 'pt.qpetiscos.agenda'; minSdk 26; targetSdk 35; versionCode 300; versionName '0.3.0' }
 signingConfigs { release { storeFile file(System.getenv('QP_KEYSTORE') ?: 'unused.jks'); storePassword System.getenv('QP_PASSWORD'); keyAlias 'qpetiscos'; keyPassword System.getenv('QP_PASSWORD') } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 buildFeatures { buildConfig true }
}
