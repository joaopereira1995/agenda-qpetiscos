plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def qpBeta = providers.gradleProperty('qpBeta').map { it.toBoolean() }.orElse(false)
def bundledWeb = layout.buildDirectory.dir('generated/qpWeb')
tasks.register('bundleQpWeb', Sync) {
    from(rootProject.projectDir.parentFile) { include 'index.html'; include 'assets/**'; include 'core/**'; include 'shared/**'; include 'mobile/**' }
    into(bundledWeb.map { it.dir('qp-web') })
}
android {
    namespace 'pt.qpetiscos.agenda'
    compileSdk 35

    defaultConfig {
        applicationId 'pt.qpetiscos.agenda'
        minSdk 26
        targetSdk 35
        versionCode = qpBeta.get() ? 802 : 810
        versionName = qpBeta.get() ? '0.8.0-beta.2' : '0.8.0'
        buildConfigField 'boolean', 'QP_BETA', qpBeta.get().toString()
    }

    sourceSets { main.assets.srcDir(bundledWeb) }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.2' }

tasks.named("preBuild").configure { dependsOn(tasks.named("bundleQpWeb")) }
