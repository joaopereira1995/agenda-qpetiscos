plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def qpBeta = providers.gradleProperty('qpBeta').map { it.toBoolean() }.orElse(false)
def bundledWeb = layout.buildDirectory.dir('generated/qpWeb')
tasks.register('bundleQpWeb', Sync) {
    from(rootProject.projectDir.parentFile) { include 'index.html'; include 'assets/**'; include 'core/**'; include 'shared/**'; include 'mobile/**' }
    into(bundledWeb.map { it.dir('qp-web') })
}
android {
    namespace 'pt.qpetiscos.agenda'
    compileSdk 35

    defaultConfig {
        applicationId (qpBeta.get() ? 'pt.qpetiscos.agenda.test' : 'pt.qpetiscos.agenda')
        manifestPlaceholders = [qpLabel: qpBeta.get() ? 'Agenda QPetiscos TEST' : 'Agenda QPetiscos', qpIcon: qpBeta.get() ? '@mipmap/ic_launcher_test' : '@mipmap/ic_launcher', qpWidgetSuffix: qpBeta.get() ? ' TEST' : '']
        buildConfigField 'String', 'QP_SUPABASE_URL', '"' + (qpBeta.get() ? 'https://ooctwbyhlpifmldcbvzi.supabase.co' : 'https://kyzwmaydwokbfmiskhcg.supabase.co') + '"'
        buildConfigField 'String', 'QP_SUPABASE_KEY', '"' + (qpBeta.get() ? 'sb_publishable_CAB6yO8JQjeP4tS52-2OiQ_uBYnmkGK' : 'sb_publishable_Ko1iv1CWVi693R9_-xwNvg_5auNwzAy') + '"'
        minSdk 26
        targetSdk 35
        versionCode = qpBeta.get() ? 921 : 918
        versionName = qpBeta.get() ? '0.10.0-beta.1' : '0.8.0'
        buildConfigField 'boolean', 'QP_BETA', qpBeta.get().toString()
    }

    sourceSets { main.assets.srcDir(bundledWeb) }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.2' }

tasks.named("preBuild").configure { dependsOn(tasks.named("bundleQpWeb")) }
