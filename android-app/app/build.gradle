plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'pt.qpetiscos.agenda'
    compileSdk 35

    defaultConfig {
        applicationId 'pt.qpetiscos.agenda'
        minSdk 26
        targetSdk 35
        versionCode 606
        versionName '0.6.6'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.2' }
