name: Publicar Web (Producao e Beta)
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: qpetiscos-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout producao
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          persist-credentials: false
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: develop
          path: development
          persist-credentials: false
      - name: Importar icones Lucide locais
        working-directory: development
        shell: bash
        run: |
          set -euo pipefail
          package=$(npm pack lucide-static@0.468.0 --pack-destination "$RUNNER_TEMP" --silent)
          python3 tools/vendor-icons.py "$RUNNER_TEMP/$package"

      - name: Importar icones Lucide locais (producao)
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/vendor-icons.py ]; then
            package=$(npm pack lucide-static@0.468.0 --pack-destination "$RUNNER_TEMP" --silent)
            python3 tools/vendor-icons.py "$RUNNER_TEMP/$package"
          fi

      - name: Preparar ambos os sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/beta
          cp production/index.html site/index.html
          cp -R production/assets site/assets
          cp development/index.html site/beta/index.html
          cp -R development/assets site/beta/assets
          for dir in core shared mobile desktop; do
            if [ -d "production/$dir" ]; then cp -R "production/$dir" "site/$dir"; fi
            if [ -d "development/$dir" ]; then cp -R "development/$dir" "site/beta/$dir"; fi
          done
          touch site/.nojekyll
          test -s site/index.html
          test -s site/beta/index.html
          if [ -f site/beta/core/app.js ]; then
            grep -q 'qpWebBeta' site/beta/core/app.js
            for file in shared/themes.css shared/base.css mobile/mobile.js core/view.js core/app.js core/bootstrap.js desktop/desktop.js desktop/desktop.css; do test -s "site/beta/$file"; done
          else
            grep -q 'qpWebBeta' site/beta/index.html
          fi
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
