name: Compilar Android

on:
  workflow_dispatch:
  push:
    branches: [develop, main]

concurrency:
  group: qpetiscos-android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name == 'develop' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      apk_name: ${{ steps.apk.outputs.name }}
      version: ${{ steps.apk.outputs.version }}
      build: ${{ steps.apk.outputs.build }}

    steps:
      - uses: actions/checkout@v4

      - name: Importar icones Lucide locais
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          package=$(npm pack lucide-static@0.468.0 --pack-destination "$RUNNER_TEMP" --silent)
          python3 tools/vendor-icons.py "$RUNNER_TEMP/$package"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar configuracao Firebase
        env:
          FIREBASE_CONFIG: ${{ github.ref_name == 'main' && secrets.GOOGLE_SERVICES_JSON_BASE64 || secrets.GOOGLE_SERVICES_JSON_TEST_BASE64 }}
        run: |
          test -n "$FIREBASE_CONFIG" || { echo "Missing GOOGLE_SERVICES_JSON_BASE64"; exit 1; }
          printf '%s' "$FIREBASE_CONFIG" | base64 --decode > android-app/app/google-services.json
          python - <<'PYVERIFY'
          import json, os
          with open('android-app/app/google-services.json') as f:
              cfg=json.load(f)
          test=os.environ['GITHUB_REF_NAME'] != 'main'
          package='pt.qpetiscos.agenda.test' if test else 'pt.qpetiscos.agenda'
          assert any(c['client_info']['android_client_info']['package_name']==package for c in cfg['client']), 'Firebase package mismatch'
          assert (cfg['project_info']['project_id']=='agenda-qpetiscos-test') == test, 'Firebase environment mismatch'
          PYVERIFY

      - name: Compilar APK Release
        working-directory: android-app
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            main) BETA=false ;;
            develop|beta/*) BETA=true ;;
            *) echo "Utiliza main (estável) ou develop / beta/* (Beta)"; exit 1 ;;
          esac
          gradle assembleRelease -PqpBeta="$BETA" --no-daemon --stacktrace

      - name: Restaurar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/agenda-qpetiscos.jks"

      - name: Obter versão do APK
        id: apk
        shell: bash
        run: |
          APK=android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          VERSION=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          test -n "$VERSION"
          BUILD=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)
          [[ "$BUILD" =~ ^[0-9]+$ ]]
          if [ "$GITHUB_REF_NAME" = main ]; then
            NAME="Agenda-QPetiscos-v$VERSION-b$BUILD"
          else
            NAME="Agenda-QPetiscos-TEST-v$VERSION-b$BUILD-${GITHUB_SHA:0:7}"
          fi
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Assinar APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$TOOLS/zipalign" -f -p 4 \
            android-app/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/app-aligned.apk"

          "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/agenda-qpetiscos.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out ${{ env.APK_NAME }}.apk \
            "$RUNNER_TEMP/app-aligned.apk"

      - name: Validar assinatura
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs \
            ${{ env.APK_NAME }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}.apk
          if-no-files-found: error

      - name: Limpar chave de assinatura
        if: always()
        run: rm -f "$RUNNER_TEMP/agenda-qpetiscos.jks" android-app/app/google-services.json

  publish-test:
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk_name }}
          path: signed
      - name: Publicar atualização Android TEST
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/develop ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$BUILD" =~ ^[0-9]+$ ]]
          [[ "$APK_NAME" == "Agenda-QPetiscos-TEST-v$VERSION-b$BUILD-${GITHUB_SHA:0:7}" ]]
          test -s "signed/$APK_NAME.apk"
          TAG="android-test-b$BUILD-${GITHUB_SHA:0:7}"
          node - <<'JS' > "$RUNNER_TEMP/test-notes.txt"
          const fs=require('fs'),vm=require('vm');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('core/release.js','utf8'),context,{timeout:1000});
          const r=context.window.qpRelease;
          if(r.version!==process.env.VERSION||!Array.isArray(r.changes)||!r.changes.length||!r.changes.every(x=>typeof x==='string')) throw Error('Changelog inválido');
          console.log(r.changes.map(x=>'• '+x).join('\n'));
          JS
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,isPrerelease > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            if jq -e --arg name "$APK_NAME.apk" '.isDraft == false and .isPrerelease == true and any(.assets[]; .name == $name)' "$RUNNER_TEMP/release.json" >/dev/null; then
              echo "Build TEST já publicada"; exit 0
            fi
            jq -e '.isDraft == true and .isPrerelease == true' "$RUNNER_TEMP/release.json" >/dev/null
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Android TEST $VERSION (build $BUILD)" --notes-file "$RUNNER_TEMP/test-notes.txt" --prerelease --draft --latest=false
          fi
          gh release upload "$TAG" "signed/$APK_NAME.apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
