name: Compilar Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Release
        working-directory: android-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Restaurar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/agenda-qpetiscos.jks"

      - name: Assinar APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$TOOLS/zipalign" -f -p 4 \
            android-app/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/app-aligned.apk"

          "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/agenda-qpetiscos.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out Agenda-QPetiscos-v0.4.0.apk \
            "$RUNNER_TEMP/app-aligned.apk"

      - name: Validar assinatura
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs \
            Agenda-QPetiscos-v0.4.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Agenda-QPetiscos-v0.4.0
          path: Agenda-QPetiscos-v0.4.0.apk
          if-no-files-found: error

      - name: Limpar chave de assinatura
        if: always()
        run: rm -f "$RUNNER_TEMP/agenda-qpetiscos.jks"
