<!doctype html><html lang="pt-PT"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda QPetiscos</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#20242b;font:14px system-ui}main{max-width:600px;margin:auto;padding:16px 16px 100px}header,nav,.filters,.actions{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:20px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;background:#fff;color:inherit;border-radius:8px;padding:9px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd0d6;border-radius:8px;background:white;color:#20242b}nav,.filters,#week{background:white;border-radius:10px;padding:8px;margin:8px 0}#week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}#week button{padding:6px 0}small{display:block;color:#68717d}.active{background:#e5edf8!important;box-shadow:inset 0 -2px #397bc8}.filters button{flex:1;white-space:nowrap;padding:8px 2px}.event{display:flex;gap:10px;background:white;border-radius:8px;margin:5px 0;padding:9px;border-left:4px solid var(--stripe)}.content{flex:1;min-width:0}.name{font-weight:700;font-size:1.1em}.note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#68717d;margin-top:4px}.note.open{white-space:pre-wrap;overflow-wrap:anywhere}.done{opacity:.55}.actions{flex-direction:column;justify-content:center;gap:2px}.actions button{padding:4px 8px}.sep{display:flex;align-items:center;gap:8px;color:#858b94;font-size:10px;margin:12px 0}.sep:before,.sep:after{content:'';height:1px;background:#ddd;flex:1}#add{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,calc((100% - 600px)/2 + 16px));display:grid;place-items:center;padding:0;line-height:1;z-index:10;border-radius:50%;background:#2265b1;color:white;width:54px;height:54px;font-size:28px;box-shadow:0 3px 12px #0003}dialog{border:0;border-radius:14px;width:min(94vw,440px);padding:20px}dialog::backd nset-bottom,0px))}</style><section id="login"><h1>Agenda QPetiscos</h1><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Entrar</button></form><form id="deviceForm" hidden><label>Nome do dispositivo<input id="deviceName" required maxlength="80" placeholder="Ex.: Balcão"></label><button type="submit">Continuar</button></form><p id="error" role="alert"></p></section><main hidden><header><h1>Agenda QPetiscos</h1><div><button id="searchToggle" aria-label="Pesquisar">⌕</button> <button id="calendarToggle" aria-label="Calendário mensal" title="Calendário mensal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></button> <button id="fontToggle">Aa</button></div></header><input id="search" placeholder="Pesquisar nome ou notas" hidden><div id="fonts" hidden><button id="minus">A−</button> <button id="reset">75%</button> <button id="plus">A+</button></div><nav><button id="prev">‹</button><strong id="dateTitle"></strong><button id="next">›</button></nav><div id="week"></div><div class="filters" id="filters"></div><header><strong>Agenda do dia</strong><button id="today">Hoje</button></header><section id="events"></section><p class="muted">v0.2.2 · <span id="status">A ligar…</span> · <button id="logout">Terminar sessão</button></p><button id="add" aria-label="Adicionar evento">+</button></main><div id="toast" hidden>Evento eliminado <button id="undo">Desfazer</button></div><div id="remoteToast" role="status" aria-live="polite" hidden><strong id="remoteTitle"></strong><div id="remoteName"></div><small id="remoteDevice"></small></div><dialog id="modal"><form id="form"><header><strong id="formTitle"></strong><button type="bu const $=id=>document.getElementById(id),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,parse=s=>new Date(s+'T12:00:00'),today=()=>iso(new Date());let selected=today(),filter='all',editing=null,expanded=new Set(),removed=null,timer;let events=[];let font=Number(localStorage.getItem('qp-font'))||12;const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');function render(){document.querySelector('main').style.fontSize=font+'px';$('reset').textContent=Math.round(font/16*100)+'%';let d=parse(selected);$('dateTitle').textContent=d.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'});let m=parse(selected);m.setDate(m.getDate()-(m.getDay()+6)%7);$('week').innerHTML=Array.from({length:7},(_,i)=>{let x=new Date(m);x.setDate(m.getDate()+i);let s=iso(x);return `<button data-day="${s}" class="${s===selected?'active':''}"><small>${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][i]}</small><b>${x.getDate()}</b><small>${events.filter(e=>e.date===s).length||'&nbsp;'}</small></button>`}).join('');let all=events.filter(e=>e.date===selected);$('filters').innerHTML=[['all','Total','#222'],['reserva','Reservas','#397bc8'],['takeaway','Takeaway','#a77900']].map(([k,n,c])=>`<button data-filter="${k}" class="${filter===k?'active':''}" style="color:${c}"><b>${all.filter(e=>k==='all'||e.kind===k).length}</b> ${n}</button>`).join('');let q=$('search').value.toLocaleLowerCase('pt-PT');let list=all.filter(e=>(filter==='all'||e.kind===filter)&&(e.name+' '+e.notes).toLocaleLowerCase('pt-PT').includes(q)).sort((a,b)=>a.time.localeCompare(b.time));let lunch=list.filter(e=>e.time<'15:00'),dinner=list.filter(e=>e.time>='15:00');$('events').innerHTML=list.length?lunch.map(card).join('')+(lunch.length&&dinner.length?'<div class="sep">JANTAR</div>':'')+dinner.map(card).join(''):'<p class="muted">Sem eventos. Carrega em + para adicionar.</p>'}function card(e){let open=expanded.has(e.id);return `<article class="event ${e.done?'done':''}" style="--stripe:${e.kind==='reserva'?'#397bc8':'#eab308'}"><div class="content"><div class="name">${esc(e.name)}</div><small>${esc(e.time)} · ${e.kind==='reserva'?'Reserva':'Takeaway'}</small>${e.notes?`<div class="note ${open?'open':''}">${esc(open?e.notes:e.notes.replaceAll('\n',' '))}</div><button class="expand" data-action="expand" data-id="${e.id}">${open?'Recolher':'Expandir notas'}</button>`:''}</div><div class="actions"><button data-action="done" data-id="${e.id}" aria-label="Concluir">${e.done?'✓':'○'}</button><div><button data-action="edit" data-id="${e.id}" aria-label="Editar">✎</button><button data-action="delete" data-id="${e.id}" aria-label="Eliminar">🗑</button></div></div></article>`}function move(n){let d=parse(selected);d.setDate(d.getDate()+n);selected=iso(d);render()}function syncKindColor(){$('kind').dataset.kind=$('kind').value} $('kind').addEventListener('change',syncKindColor);syncKindColor();function openForm(e){editing=e?.id??null;$('formTitle').textContent=e?'Editar evento':'Novo evento';$('kind').value=e?.kind||'reserva';syncKindColor();$('name').value=e?.name||'';$('date').value=e?.date||selected;$('time').value=e?.time||new Date().toTimeString().slice(0,5);$('notes').value=e?.notes||'';$('modal').showModal()}$('form').onsubmit=async e=>{e.preventDefault();let name=$('name').value.trim();if(!name)return;const id=editing, data={name,type:$('kind').value,event_date:$('date').value,event_time:$('time').value,notes:$('notes').value,updated_by:device.id};await mutate(async()=>{const q=id?db.from('events').update(data).eq('id',id):db.from('events').insert({...data,user_id:user.id,created_by:device.id});check(await q.select('id').single());selected=data.event_date;$('modal').close()})};
$('events').onclick=async e=>{let b=e.target.closest('[data-action]');if(!b)return;let x=events.find(x=>x.id===b.dataset.id);if(!x)return;switch(b.dataset.action){case 'expand':expanded.has(x.id)?expanded.delete(x.id):expanded.add(x.id);render();return;case 'edit':openForm(x);return;case 'done':await mutate(async()=>check(await db.from('events').update({completed:!x.done,updated_by:device.id}).eq('id',x.id).select('id').single()));return;case 'delete':await mutate(async()=>{check(await db.from('events').update({deleted_at:new Date().toISOString(),updated_by:device.id}).eq('id',x.id).select('id').single());clearTimeout(timer);removed=x;$('toast').hidden=false;timer=setTimeout(()=>{removed=null;$('toast').hidden=true},3000)});return}};
$('undo').onclick=async()=>{if(!removed)return;const x=removed;await mutate(async()=>{check(await db.from('events').update({deleted_at:null,updated_by:device.id}).eq('id',x.id).select('id').single());removed=null;clearTimeout(timer);$('toast').hidden=true})};$('week').onclick=e=>{let b=e.target.closest('[data-day]');if(b){selected=b.dataset.day;render()}};$('filters').onclick=e=>{let b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('today').onclick=()=>{selected=today();render()};$('add').onclick=()=>openForm();$('close').onclick=()=>$('modal').close();$('searchToggle').onclick=()=>{$('search').hidden=!$('search').hidden;if($('search').hidden){$('search').value='';render()}else $('search').focus()};$('search').oninput=render;$('fontToggle').onclick=()=>$('fonts').hidden=!$('fonts').hidden;function setFont(n){font=Math.max(10,Math.min(24,n));localStorage.setItem('qp-font',font);render()}$('minus').onclick=()=>setFont(font-2);$('plus').onclick=()=>setFont(font+2);$('reset').onclick=()=>setFont(12);
let monthCursor;
function renderMonth(){const y=monthCursor.getFullYear(),m=monthCursor.getMonth();$('monthTitle').textContent=monthCursor.toLocaleDateString('pt-PT',{month:'long',year:'numeric'});const first=new Date(y,m,1,12),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells=Math.ceil((offset+days)/7)*7;const counts=new Map();for(const e of events)counts.set(e.date,(counts.get(e.date)||0)+1);$('monthGrid').innerHTML=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(n=>`<span class="weekday">${n}</span>`).join('')+Array.from({length:cells},(_,i)=>{const d=new Date(y,m,1-offset+i,12),s=iso(d),n=counts.get(s)||0;return `<button data-month-day="${s}" aria-label="${s}, ${n} eventos" class="${d.getMonth()!==m?'outside ':''}${s===selected?'active ':''}${s===today()?'current':''}"><b>${d.getDate()}</b><small>${n||'&nbsp;'}</small></button>`}).join('')}
$('calendarToggle').onclick=()=>{const d=parse(selected);monthCursor=new Date(d.getFullYear(),d.getMonth(),1,12);renderMonth();$('monthModal').showModal()};
function shiftMonth(n){monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+n,1,12);renderMonth()}
$('monthPrev').onclick=()=>shiftMonth(-1);$('monthNext').onclick=()=>shiftMonth(1);$('monthClose').onclick=()=>$('monthModal').close();
function selectMonthDay(s){selected=s;$('monthModal').close();render()}
$('monthGrid').onclick=e=>{const b=e.target.closest('[data-month-day]');if(b)selectMonthDay(b.dataset.monthDay)};$('monthToday').onclick=()=>selectMonthDay(today());
const db=window.supabase?.createClient('https://kyzwmaydwokbfmiskhcg.supabase.co','sb_publishable_Ko1iv1CWVi693R9_-xwNvg_5auNwzAy');
let user=null,device=null,channel=null,busy=false,loadSeq=0;
function check(r){if(r.error)throw r.error;return r.data}
function error(e){return e?.message||String(e)}
async function refresh(){const seq=++loadSeq;let rows=[],offset=0;try{while(true){const page=check(await db.from('events').select('id,type,name,event_date,event_time,notes,completed').is('deleted_at',null).order('id').range(offset,offset+499));rows.push(...page);if(page.length<500)break;offset+=500}if(seq!==loadSeq||!user)return;events=rows.map(x=>({id:x.id,kind:x.type,name:x.name,date:x.event_date,time:x.event_time.slice(0,5),notes:x.notes,done:x.completed}));render();if($('monthModal').open)renderMonth();$('status').textContent='Sincronizado · '+device.name}catch(e){$('status').textContent='Erro de sincronização: '+error(e)}}
async function mutate(fn){if(busy||!device)return;busy=true;try{await fn();await refresh()}catch(e){alert('Não foi possível guardar: '+error(e))}finally{busy=false}}

const remoteQueue=[];let remoteShowing=false,remoteChain=Promise.resolve();const remoteSeen=new Set();
function showRemote(){if(remoteShowing||!remoteQueue.length)return;remoteShowing=true;const n=remoteQueue.shift();$('remoteTitle').textContent=n.title;$('remoteName').textContent=n.name;$('remoteDevice').textContent='Por: '+n.device;$('remoteToast').hidden=false;setTimeout(()=>{$('remoteToast').hidden=true;remoteShowing=false;showRemote()},3000)}
async function remoteNotice(payload){const row=payload.new;if(!row?.id||!device||row.updated_by===device.id)return;const key=row.id+'|'+row.updated_at;if(remoteSeen.has(key))return;remoteSeen.add(key);if(remoteSeen.size>500)remoteSeen.delete(remoteSeen.values().next().value);try{const history=check(await db.from('event_history').select('action,new_data').eq('event_id',row.id).eq('created_at',row.updated_at).limit(1).maybeSingle());if(!history)return;const action=history.action;if(!['created','updated','deleted'].includes(action))return;const source=check(await db.from('devices').select('name').eq('id',row.updated_by).maybeSingle());const reserve=row.type==='reserva';const title=action==='created'?(reserve?'Nova reserva':'Novo takeaway'):action==='deleted'?(reserve?'Reserva eliminada':'Takeaway eliminado'):(reserve?'Reserva editada':'Takeaway editado');remoteQueue.push({title,name:row.name,device:source?.name||'Dispositivo desconhecido'});showRemote()}catch(e){console.warn('Notificação:',error(e))}}
function onRemoteChange(payload){refresh();remoteChain=remoteChain.then(()=>remoteNotice(payload)).catch(e=>console.warn(e))}

async function start(){if(channel)await db.removeChannel(channel);$('login').hidden=true;document.querySelector('main').hidden=false;await refresh();channel=db.channel('qp-events').on('postgres_changes',{event:'*',schema:'public',table:'events',filter:'user_id=eq.'+user.id},onRemoteChange).subscribe(status=>{if(status==='SUBSCRIBED')refresh();else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')$('status').textContent='Ligação em tempo real interrompida'});}
async function setup(u){user=u;const id=localStorage.getItem('qp-device-'+u.id);device=id?check(await db.from('devices').select('id,name').eq('id',id).maybeSingle()):null;if(device){await start()}else{$('loginForm').hidden=true;$('deviceForm').hidden=false}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('error').textContent='A ligar…';try{const data=check(await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}));$('password').value='';$('error').textContent='';await setup(data.user)}catch(e){$('error').textContent=error(e)}};
$('deviceForm').onsubmit=async e=>{e.preventDefault();const name=$('deviceName').value.trim();if(!name)return;try{device=check(await db.from('devices').insert({user_id:user.id,name,platform:'web'}).select('id,name').single());localStorage.setItem('qp-device-'+user.id,device.id);await start()}catch(e){$('error').textContent=error(e)}};
$('logout').onclick=async()=>{try{check(await db.auth.signOut());location.reload()}catch(e){alert(error(e))}};
window.addEventListener('online',()=>{if(device)refresh()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&device)refresh()});setInterval(()=>{if(device&&!document.hidden)refresh()},30000);
(async()=>{try{if(!db)throw new Error('Não foi possível carregar o Supabase. Verifica a Internet.');const data=check(await db.auth.getSession());if(data.session)await setup(data.session.user)}catch(e){$('error').textContent=error(e)}})();</script></html>
